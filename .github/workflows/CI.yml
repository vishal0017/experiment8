name: ML pipeline
on:
  push: 
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Project code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries/dependencies
        run: pip install -r requirements.txt
      - name: ML model Training
        run: python train.py
      - name: ML model Testing
        run: python test.py
      - name: Deploy to Render
        if: success() && github.ref == 'ref/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
        run: curl --fail --silent --show-error "$DEPLOY_HOOK_URL"